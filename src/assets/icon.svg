      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- Folder body -->
  <rect x="44" y="96" width="168" height="108" rx="12" fill="white" opacity="0.2"/>
  <!-- Folder tab -->
  <path d="M44 96 L44 80 Q44 70 54 70 L108 70 L122 84 L202 84 Q212 84 212 94 L212 96 Z" fill="white" opacity="0.2"/>
  <!-- Folder face (lighter) -->
