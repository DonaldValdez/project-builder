name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger — lets you attach builds to an existing release tag
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach builds to (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  # ── Windows: NSIS installer (.exe) ──────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    env:
      # Skip code signing — no certificate on CI
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        # BMPs are already committed; skip regenerating them to avoid sharp issues on CI
        run: npx electron-vite build && npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/*.exe

  # ── macOS: Universal DMG (Intel + Apple Silicon) ─────────────────────────────
  build-mac:
    runs-on: macos-latest
    env:
      # Skip code signing and notarization — no certificate on CI
      CSC_IDENTITY_AUTO_DISCOVERY: false
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # --omit=optional skips sharp's platform-specific native binaries (not needed for macOS build)
        run: npm ci --omit=optional

      - name: Build macOS DMG
        run: npx electron-vite build && npx electron-builder --mac --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: release/*.dmg

  # ── Publish: attach both files to the GitHub Release ─────────────────────────
  publish:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Attach builds to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On tag push: use the pushed tag. On manual dispatch: use the input.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          files: dist/*
          generate_release_notes: false
          fail_on_unmatched_files: false
